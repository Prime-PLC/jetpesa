name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.invalid
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      FIREBASE_PROJECT_ID: ci-project
      FIREBASE_CLIENT_EMAIL: ci@ci-project.iam.gserviceaccount.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create ephemeral Firebase key for build validation
        shell: bash
        run: |
          echo 'FIREBASE_PRIVATE_KEY<<CI_FIREBASE_KEY' >> "$GITHUB_ENV"
          openssl genrsa 2048 >> "$GITHUB_ENV"
          echo 'CI_FIREBASE_KEY' >> "$GITHUB_ENV"

      - name: Build application
        run: npm run build
